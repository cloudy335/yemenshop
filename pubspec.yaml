name: yemenshop
description: "A Yemeni e-commerce application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.3
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.5
  carousel_slider: ^5.0.0
  convex_bottom_bar: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  hugeicons: ^0.0.11
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  animate_do: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.3

# ========== LAUNCHER ICONS ==========
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700