# pubspec.yaml
name: yemenshop
description: "A Yemeni e-commerce application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.3
  flutter_bloc: ^8.1.3
  bloc: ^8.1.3
  equatable: ^2.0.5
  carousel_slider: ^4.2.1
  convex_bottom_bar: ^3.0.0
  flutter_staggered_grid_view: ^0.6.0
  hugeicons: ^0.0.11
  unicons: ^3.0.0
  google_maps_flutter: ^2.12.3
  geocoding: ^4.0.0
  shared_preferences: ^2.5.3
  location: ^8.0.1
  app_settings: ^6.1.1
  google_maps_flutter_platform_interface: ^2.4.0
  font_awesome_flutter: ^10.8.0

  # for RTL and date formatting
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
