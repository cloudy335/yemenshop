name: yemenshop-1
description: "A Yemeni e-commerce application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_text_kit: ^3.2.2 # تم تحديث الإصدار
  flutter_bloc: ^8.1.3 # BLoC state management
  bloc: ^8.1.2 # Core BLoC library
  equatable: ^2.0.5 # Recommended for BLoC (optional but useful)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.4 # Testing for BLoC
  build_runner: ^2.4.6 # Code generation (for freezed/sealed classes)

flutter:
  uses-material-design: true
  assets:
    - assets/images/ # إضافة المجلد كامل بدل ملف واحد
