name: yemenshop
description: "A Yemeni e-commerce application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.3
  flutter_bloc: ^8.1.3
  bloc: ^8.1.3
  equatable: ^2.0.5
  carousel_slider: ^4.2.1
  convex_bottom_bar: ^3.0.0
  flutter_staggered_grid_view: ^0.6.0
  hugeicons: ^0.0.11
  unicons: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.4
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.3

# ← This must be here, at the root, not indented under flutter:
flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/Logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
